version: 1.0
runtime: nodejs22
build:
  commands:
    pre-build:
      - corepack enable
      - corepack prepare pnpm@9.15.3 --activate
    build:
      - corepack enable
      - corepack prepare pnpm@9.15.3 --activate
      - pnpm install --frozen-lockfile
      - pnpm run build
run:
  command: npx next start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_ENV
      value: "production"

